name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test (simulated TPPA and mount)
        run: dotnet run --project OatAutoPA.Tests -c Release

      - name: Build plugin
        run: dotnet build OatAutoPA/OatAutoPA.csproj -c Release

      - name: Package
        shell: pwsh
        run: |
          $dll = "OatAutoPA/bin/Release/net8.0-windows/OatAutoPA.dll"
          $version = (Get-Item $dll).VersionInfo.FileVersion
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { "OatAutoPA-$env:GITHUB_REF_NAME" } else { "OatAutoPA-$version-$($env:GITHUB_SHA.Substring(0,7))" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $dll -DestinationPath "dist/$name.zip" -Force
          "PACKAGE=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Built $name (assembly $version)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: dist/${{ env.PACKAGE }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
